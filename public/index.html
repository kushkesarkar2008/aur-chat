<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUR - WhatsApp Web Style Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        whatsapp: {
                            dark: '#111b21',
                            panel: '#202c33',
                            chat: '#0b141a',
                            green: '#00a884',
                            hover: '#2a3942',
                            bubble: '#005c4b',
                            incoming: '#202c33',
                            text: '#e9edef',
                            muted: '#8696a0'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .bg-dots {
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-whatsapp-dark text-whatsapp-text h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Auth Screen -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4 bg-whatsapp-chat">
        <div class="bg-whatsapp-panel border border-slate-700/50 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-whatsapp-green rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold text-white shadow-lg">AUR</div>
                <h1 class="text-2xl font-bold tracking-wide">Welcome to AUR</h1>
                <p class="text-xs text-whatsapp-muted mt-1">End-to-end styled web chat experience</p>
            </div>
            
            <div id="auth-error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3 rounded-lg mb-4"></div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-whatsapp-muted mb-1">Username</label>
                    <input type="text" id="username" required class="w-full bg-whatsapp-dark border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-whatsapp-green text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-whatsapp-muted mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-whatsapp-dark border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-whatsapp-green text-sm">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-whatsapp-green hover:bg-emerald-600 transition font-medium py-3 rounded-xl text-sm shadow-md text-white">Sign In</button>
            </form>

            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" id="toggle-mode-btn" class="text-xs text-whatsapp-green hover:underline">Don't have an account? Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Main Chat Screen -->
    <div id="chat-screen" class="hidden flex-1 flex h-full overflow-hidden">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-full md:w-[380px] bg-whatsapp-panel border-r border-slate-800 flex flex-col h-full">
            <!-- Header -->
            <div class="p-3 bg-whatsapp-panel border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="openSettings()">
                    <div class="w-10 h-10 rounded-full bg-whatsapp-green flex items-center justify-center font-bold text-white text-sm" id="my-avatar">U</div>
                    <span class="font-semibold text-sm" id="my-username">User</span>
                </div>
                <div class="flex items-center space-x-4 text-whatsapp-muted text-lg">
                    <button onclick="openGroupModal()" title="Create Group" class="hover:text-whatsapp-text"><i class="fa-solid fa-users"></i></button>
                    <button onclick="openSettings()" title="Settings" class="hover:text-whatsapp-text"><i class="fa-solid fa-gear"></i></button>
                    <button onclick="logout()" title="Logout" class="hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <!-- Search & Filters -->
            <div class="p-2.5 bg-whatsapp-panel border-b border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-whatsapp-muted text-xs"></i>
                    <input type="text" id="search-user" placeholder="Search or start new chat" class="w-full bg-whatsapp-dark border border-transparent rounded-lg pl-9 pr-4 py-2 text-xs focus:outline-none focus:border-whatsapp-green">
                </div>
                <div class="flex gap-2">
                    <button onclick="filterChats('all')" id="filter-all" class="px-3 py-1 rounded-full text-xs bg-whatsapp-green text-white font-medium">All</button>
                    <button onclick="filterChats('unread')" id="filter-unread" class="px-3 py-1 rounded-full text-xs bg-whatsapp-dark text-whatsapp-muted hover:bg-whatsapp-hover">Unread</button>
                    <button onclick="filterChats('groups')" id="filter-groups" class="px-3 py-1 rounded-full text-xs bg-whatsapp-dark text-whatsapp-muted hover:bg-whatsapp-hover">Groups</button>
                </div>
            </div>

            <!-- Chats List -->
            <div id="users-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/40">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-area" class="hidden md:flex flex-1 flex-col bg-whatsapp-chat bg-dots relative h-full">
            <!-- Active Chat Header -->
            <div id="chat-header" class="px-4 py-2.5 bg-whatsapp-panel border-b border-slate-800 flex items-center justify-between z-10">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebar()" class="md:hidden text-whatsapp-muted hover:text-white mr-1"><i class="fa-solid fa-arrow-left text-base"></i></button>
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-sm text-white" id="active-avatar">#</div>
                    <div>
                        <h3 class="font-semibold text-sm" id="active-username">Select a chat</h3>
                        <p class="text-[11px] text-whatsapp-muted" id="active-status">click a contact to start messaging</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4 text-whatsapp-muted text-lg">
                    <button class="hover:text-whatsapp-text"><i class="fa-solid fa-phone"></i></button>
                    <button class="hover:text-whatsapp-text"><i class="fa-solid fa-video"></i></button>
                    <button class="hover:text-whatsapp-text"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <!-- Messages Box -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-2 flex flex-col">
                <div class="m-auto text-center text-whatsapp-muted">
                    <i class="fa-brands fa-whatsapp text-6xl mb-3 text-whatsapp-green/40"></i>
                    <p class="text-sm">AUR Web for seamless secure communication</p>
                </div>
            </div>

            <!-- Typing indicator -->
            <div id="typing-indicator" class="hidden px-4 py-1 text-[11px] text-whatsapp-green italic bg-whatsapp-panel/40">Typing...</div>

            <!-- Input Bar -->
            <form id="message-form" class="p-3 bg-whatsapp-panel border-t border-slate-800 hidden items-center gap-3">
                <button type="button" onclick="toggleEmojiPicker()" class="text-whatsapp-muted hover:text-whatsapp-text text-xl"><i class="fa-regular fa-face-smile"></i></button>
                <button type="button" class="text-whatsapp-muted hover:text-whatsapp-text text-xl"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="message-input" placeholder="Type a message" autocomplete="off" class="flex-1 bg-whatsapp-dark border border-transparent rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-whatsapp-green text-whatsapp-text">
                <button type="submit" class="bg-whatsapp-green hover:bg-emerald-600 text-white w-10 h-10 rounded-xl transition flex items-center justify-center shadow"><i class="fa-solid fa-paper-plane text-sm"></i></button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-whatsapp-panel border border-slate-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
            <h2 class="text-lg font-bold mb-4 flex justify-between items-center">Settings <button onclick="closeSettings()" class="text-whatsapp-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button></h2>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-whatsapp-muted mb-1">About Text</label>
                    <input type="text" id="about-input" value="Hey there! I am using AUR" class="w-full bg-whatsapp-dark border border-slate-700 rounded-lg p-2.5 text-whatsapp-text">
                </div>
                <div>
                    <label class="block text-whatsapp-muted mb-1">Theme</label>
                    <div class="flex gap-2">
                        <button onclick="setTheme('dark')" class="px-3 py-1.5 rounded bg-whatsapp-dark border border-slate-700">Dark</button>
                        <button onclick="setTheme('amoled')" class="px-3 py-1.5 rounded bg-black border border-slate-800">Amoled</button>
                    </div>
                </div>
                <button onclick="saveSettings()" class="w-full bg-whatsapp-green text-white py-2.5 rounded-xl font-medium mt-2">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div id="group-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-whatsapp-panel border border-slate-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
            <h2 class="text-lg font-bold mb-4 flex justify-between items-center">Create Squad Group <button onclick="closeGroupModal()" class="text-whatsapp-muted hover:text-white"><i class="fa-solid fa-xmark"></i></button></h2>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-whatsapp-muted mb-1">Group Name</label>
                    <input type="text" id="group-name-input" placeholder="e.g. AI Engineers" class="w-full bg-whatsapp-dark border border-slate-700 rounded-lg p-2.5 text-whatsapp-text">
                </div>
                <button onclick="createGroup()" class="w-full bg-whatsapp-green text-white py-2.5 rounded-xl font-medium mt-2">Create Group</button>
            </div>
        </div>
    </div>

    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let isLoginMode = true;
        let currentUser = null;
        let activeRecipient = null;
        let allUsers = [];
        const socket = io();

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').innerText = isLoginMode ? "Sign In" : "Sign Up";
            document.getElementById('toggle-mode-btn').innerText = isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Sign In";
            document.getElementById('auth-error').classList.add('hidden');
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            try {
                const res = await fetch(isLoginMode ? '/api/login' : '/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                currentUser = data.user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('my-username').innerText = currentUser.username;
                document.getElementById('my-avatar').innerText = currentUser.username[0].toUpperCase();
                socket.emit('join', currentUser.id);
                loadUsers();
            } catch (err) {
                const errBox = document.getElementById('auth-error');
                errBox.innerText = err.message;
                errBox.classList.remove('hidden');
            }
        });

        async function loadUsers() {
            const res = await fetch('/api/users');
            allUsers = await res.json();
            renderUsersList(allUsers);
        }

        function renderUsersList(users) {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            users.filter(u => u.id !== currentUser.id).forEach(u => {
                const div = document.createElement('div');
                div.className = `p-3 flex items-center justify-between cursor-pointer hover:bg-whatsapp-hover transition ${activeRecipient?.id === u.id ? 'bg-whatsapp-hover' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 rounded-full bg-slate-700 flex items-center justify-center font-bold text-whatsapp-green text-sm">${u.username[0].toUpperCase()}</div>
                        <div>
                            <h4 class="font-medium text-xs text-whatsapp-text">${u.username}</h4>
                            <p class="text-[11px] text-whatsapp-muted">${u.online ? 'Online' : 'Offline'}</p>
                        </div>
                    </div>
                `;
                div.onclick = () => selectRecipient(u);
                list.appendChild(div);
            });
        }

        function selectRecipient(user) {
            activeRecipient = user;
            document.getElementById('active-username').innerText = user.username;
            document.getElementById('active-avatar').innerText = user.username[0].toUpperCase();
            document.getElementById('active-status').innerText = user.online ? 'Online' : 'Offline';
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-area').classList.remove('hidden');
                document.getElementById('chat-area').classList.add('flex');
            }
            document.getElementById('message-form').classList.remove('hidden');
            document.getElementById('message-form').classList.add('flex');
            loadMessages();
        }

        function backToSidebar() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chat-area').classList.add('hidden');
            activeRecipient = null;
        }

        async function loadMessages() {
            if (!activeRecipient) return;
            const res = await fetch(`/api/messages/${activeRecipient.id}`);
            const messages = await res.json();
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            messages.forEach(msg => appendMessageToUI(msg));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageToUI(msg) {
            const container = document.getElementById('messages-container');
            const isMe = msg.sender === currentUser.id;
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-1`;
            div.innerHTML = `
                <div class="max-w-[70%] rounded-lg px-3 py-1.5 text-xs relative shadow-sm ${isMe ? 'bg-whatsapp-bubble text-white rounded-tr-none' : 'bg-whatsapp-incoming text-whatsapp-text rounded-tl-none'}">
                    <p class="pr-12">${msg.text}</p>
                    <span class="text-[9px] text-whatsapp-muted float-right ml-2 mt-1">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} ${isMe ? '<i class="fa-solid fa-check-double text-sky-400"></i>' : ''}</span>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('message-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = document.getElementById('message-input').value.trim();
            if (!text || !activeRecipient) return;
            const msgData = { sender: currentUser.id, recipient: activeRecipient.id, text, timestamp: new Date() };
            socket.emit('private_message', msgData);
            appendMessageToUI(msgData);
            document.getElementById('message-input').value = '';
        });

        socket.on('private_message', (msg) => {
            if (activeRecipient && (msg.sender === activeRecipient.id || msg.recipient === activeRecipient.id)) {
                appendMessageToUI(msg);
            }
        });

        socket.on('users_updated', () => loadUsers());

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
        function openGroupModal() { document.getElementById('group-modal').classList.remove('hidden'); }
        function closeGroupModal() { document.getElementById('group-modal').classList.add('hidden'); }
        function setTheme(t) { if(t==='amoled') document.body.style.backgroundColor = '#000000'; else document.body.style.backgroundColor = '#111b21'; }
        function saveSettings() { closeSettings(); }
        function createGroup() { alert('Group creation ready for next update!'); closeGroupModal(); }
        function logout() { location.reload(); }
        function filterChats(type) {
            document.querySelectorAll('#sidebar button').forEach(b => b.classList.remove('bg-whatsapp-green', 'text-white'));
            if(type==='all') renderUsersList(allUsers);
        }
    </script>
</body>
</html>
